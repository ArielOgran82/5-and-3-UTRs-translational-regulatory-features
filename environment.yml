# Conda environment for reproducing the analyses in this repository.
# Create with: conda env create -f environment.yml
# Then: conda activate utr-te-ml
#
# This replaces an earlier version of this file that was a raw export of a
# full local development environment (590 lines, including many unrelated
# packages and OS-specific build strings) - not portable to another machine.
# This version lists only the packages this repository's code actually uses;
# see requirements.txt for the equivalent pip-only list.
name: utr-te-ml
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy>=1.25
  - pandas>=2.1
  - scikit-learn>=1.5
  - scipy>=1.9
  - statsmodels>=0.14
  - xgboost>=2.1
  - matplotlib>=3.9
  - networkx>=3.2
  - tqdm>=4.70
  - nbformat>=5.10
  - nbclient>=0.10
  - jupyter>=1.0
  - ipykernel>=6.29
